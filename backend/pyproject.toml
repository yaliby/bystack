[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bystack"
version = "0.1.0"
description = "Infrastructure control plane for Docker-based infrastructure"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6",
    "asyncssh>=2.18",
    # The agent wire contract (ADR-0009). Only the runtime is required here:
    # the generated bindings are checked in, so installing the Controller
    # never needs a protobuf compiler.
    "protobuf>=5.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    # Regenerates the bindings above. Dev-only, and `test_wire.py` skips
    # rather than fails when it is absent, so the suite still runs without it.
    "grpcio-tools>=1.66",
    "types-protobuf>=5.27",
    "types-PyYAML>=6",
]

[project.scripts]
bystack = "bystack.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bystack"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated by protoc. Not ours to style, and reformatting it would make every
# regeneration a diff against the linter rather than against the contract.
extend-exclude = ["src/bystack/agent/v1/*_pb2.py", "src/bystack/agent/v1/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
# The kernel is where type errors are most expensive, so it is held to the
# strictest setting; adapters that wrap loosely-typed external payloads
# (Docker JSON, asyncssh) are allowed a little more slack.
[[tool.mypy.overrides]]
module = ["bystack.providers.*", "bystack.infra.transports.*"]
disallow_any_explicit = false
# Generated by protoc, same reason it is excluded from ruff: the bare
# `Mapping` in its signatures is protoc's output, not a choice of ours, and
# regenerating would reintroduce it on every run. `exclude` would not do it --
# mypy still follows a stub that other modules import.
[[tool.mypy.overrides]]
module = ["bystack.agent.v1.*"]
disallow_any_generics = false

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are evaluated once at import and are immutable
# by design; B008 is a false positive for the entire framework idiom.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]
