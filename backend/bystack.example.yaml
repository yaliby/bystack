# ByStack configuration.
#
# This file says only WHERE TO LOOK. It never describes topology -- topology is
# discovered, always. Manual configuration exists as optional metadata, never as
# a source of structure.

hosts:
  # The local engine.
  - id: laptop
    transport:
      type: local_socket
      path: /var/run/docker.sock

  # A remote engine over SSH. The default for remote hosts: no PKI to manage,
  # and no Docker daemon exposed on the network. The Docker socket is
  # root-equivalent, so not publishing it is worth a great deal.
  - id: lab-01
    transport:
      type: ssh_tunnel
      host: 10.0.0.5
      port: 22
      username: ops
      # client_key: ~/.ssh/id_ed25519   # omit to use the SSH agent
      # known_hosts: ~/.ssh/known_hosts # omit to use the default files
      # insecure_skip_host_key_check: false   # development only; accepts MITM
      remote_socket: /var/run/docker.sock

    # Seconds between full reconciles. This is the safety net for events the
    # daemon dropped -- not a polling interval. Real-time updates come from the
    # event stream; this only repairs what that stream missed.
    resync_interval: 300

  - id: retired-node
    enabled: false

# Refuse every mutating operation. Secure default: opt out deliberately.
#
# Set to false to enable start / stop / restart / pause / unpause / kill on
# containers, services and stacks. Discovery is unaffected either way -- it is
# read-only by nature.
#
# There is no per-operation switch and no allow-list, because there is not yet
# anything to attach one to: authentication does not exist, so every operation
# is recorded against `anonymous`. Until it does, this one flag is the whole
# authorization model, and pretending otherwise with finer-grained settings
# would suggest a control that is not there. See docs/adr/0012.
read_only: true

# Where agents dial in. Says far less than `hosts:` above, because agents
# arrive rather than being reached -- there is nothing here about addresses,
# credentials or transports. That whole category of configuration is what
# ADR-0008 deleted.
#
# Both discovery paths run during the migration. A host managed by an agent
# does not appear under `hosts:` at all; it registers itself on first
# connection and is keyed by its Docker Engine ID.
agents:
  # Off by default. mTLS enrollment (ADR-0011) is not built yet, so this
  # endpoint currently trusts whoever reaches it. Do not expose the port.
  enabled: false

  # Adopt an unknown engine id on first connection instead of refusing it.
  # With this on, whatever connects first *becomes* a managed host --
  # acceptable on a trusted network, never as a shipped default.
  auto_approve: false

  # Seconds between agent-side resyncs, sent to the agent in HelloAck. Three
  # times the agentless interval: the agent reads a unix socket on the same
  # kernel, so there is no network to lose. This now defends only against
  # agent-side hash map bugs, and at steady state it puts zero bytes on the
  # wire, because nothing changed and therefore nothing is sent.
  resync_interval: 900

api:
  # Loopback by default. This service holds root-equivalent access to every
  # engine it manages; binding it to the world on first run is not a default
  # any platform should ship.
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - http://localhost:5173

log_level: INFO
