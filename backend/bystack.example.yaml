# ByStack configuration.
#
# This file says only WHERE TO LOOK. It never describes topology -- topology is
# discovered, always. Manual configuration exists as optional metadata, never as
# a source of structure.

# Refuse every mutating operation. **Defaults to false** -- this is a control
# plane and not a diagram.
#
# It shipped `true` on the reasoning that a mutating default is never safe.
# ADR-0014 closed that door from the other side instead: everything in
# `CommandKind` is a reversible lifecycle transition, the API binds to
# loopback, and every attempt is recorded durably. The worst a wrong click does
# is restart a container. Against that, the cost of the safe default was paid
# on every first run -- a platform whose whole point is "the live map is the
# control surface" came up refusing every action, with no error a new operator
# could connect to a setting they had never read about.
#
# Set it to true to get the viewer back: a Controller pointed at production
# from a laptop, or any host you want to watch and not touch. It is enforced at
# one choke point (`CommandService`) and again by each agent on its own
# authority, so it is a real guarantee rather than a UI preference.
#
# There is no per-operation switch and no allow-list, and there will not be
# one: nothing authenticates a browser to this API by design (ADR-0014), so
# there is nobody to attach a permission to. Finer-grained settings would
# suggest a control that is not there.
read_only: false

# Where agents dial in. This is the entire discovery configuration, because
# agents arrive rather than being reached -- there is nothing here about
# addresses, credentials or transports. That whole category of configuration
# is what ADR-0008 deleted, and `hosts:` is now a hard error if present.
#
# A managed host is not listed anywhere: it registers itself on first
# connection and is keyed by its Docker Engine ID.
agents:
  # Off by default, though no longer because we cannot tell who is calling --
  # every connection is mutually authenticated against the Controller's own CA
  # (ADR-0011). What is left is narrower and still worth defaulting away from:
  # this binds a port, usually a public one, and a Controller someone started
  # to look at a graph should not open it unasked.
  enabled: false

  # Where agents dial. A separate listener from the browser's, deliberately:
  # one side may sit behind an ordinary reverse proxy, and this one must not be
  # terminated by anything that would strip a client certificate.
  listen: "0.0.0.0:8443"

  # What agents will have typed after `wss://`. THE ONE FIELD A REAL
  # DEPLOYMENT MUST SET: a certificate without the name in it fails
  # verification, correctly, and the agent will say so. Defaulted to loopback
  # rather than to a guess, because a guessed hostname produces a certificate
  # that is wrong in a way that reads as a bug in the CA.
  server_names:
    - localhost
    - 127.0.0.1

  # Approve an agent on enrollment instead of leaving it pending. A valid join
  # token always yields a certificate; approval is the separate question of
  # whether that agent contributes to the graph. Leaving this off means a
  # stolen token produces a *visible pending host* rather than a silent managed
  # one -- and that visibility is the entire point. Reasonable while bringing
  # up a fleet, never as a shipped default.
  auto_approve: false

  # Lifetime of an issued agent certificate. Renewed by the Controller at two
  # thirds elapsed, over the connection that is already open and already
  # authenticated: no cron job, no second channel, no expiry outage.
  cert_ttl_days: 90

  # The CA private key and the enrollment registry. THE ONE DIRECTORY HERE
  # WORTH BACKING UP -- losing the key means re-enrolling the fleet, and the
  # registry is the operator's record of which hosts were approved. Everything
  # else the Controller knows is rebuilt from the agents within seconds of a
  # cold start.
  state_dir: "~/.local/state/bystack"

  # Signed agent releases to distribute (ADR-0017). Empty puts them in
  # `<state_dir>/releases`.
  #
  # A directory of `bystack-agent-<arch>` files, each beside the `.manifest`
  # and `.manifest.sig` that `scripts/sign-agent.py` produced. **The Controller
  # holds no signing key and cannot make any of them.** It picks the artifact
  # matching each host and sends it; the host decides whether to run it,
  # against a key compiled into the agent.
  #
  # That is what makes *how the files got here* an operational question rather
  # than a trust decision -- fetched from GitHub Releases, copied off a laptop,
  # dropped in by configuration management, all equivalent. Unlike `state_dir`
  # above, nothing in here is worth backing up: every file is a public artifact
  # that can be downloaded again.
  #
  # An empty directory is the ordinary state and not a fault. It means this
  # Controller distributes nothing, and hosts are upgraded by running
  # `scripts/install-agent.sh` on them -- which is what every host does for its
  # first install anyway.
  releases_dir: ""

  # Seconds between agent-side resyncs, sent to the agent in HelloAck. Long,
  # because the agent reads a unix socket on the same kernel and there is no
  # network to lose. This defends only against agent-side hash map bugs, and
  # at steady state it puts zero bytes on the wire, because nothing changed
  # and therefore nothing is sent.
  resync_interval: 900

# The agent the Controller spawns for its own machine (docs/MIGRATION.md #4).
#
# This is what zero-config startup is. It is not a second discovery path: the
# Controller runs the same agent binary every managed host runs, over a unix
# socket instead of TLS, and everything above the transport is the code that
# serves the fleet. The Controller still opens no Docker socket itself.
local_agent:
  # On by default, unlike `agents.enabled`, and for the reason that one is off:
  # this binds no port and admits no stranger. Where there is no engine on this
  # machine it says so and costs nothing.
  enabled: true

  # Path to bystack-agent. Empty searches BYSTACK_AGENT_BINARY, the bundled
  # copy, PATH, and a source checkout's build directory, in that order. Set
  # explicitly it is an assertion and is never fallen back from.
  binary: ""

  # The engine the child reads. Never opened by the Controller.
  docker_socket: /var/run/docker.sock

  # Where the local agent dials. Empty puts it in `agents.state_dir`. Created
  # 0600 in a 0700 directory, which is the whole of this connection's
  # authentication: anything that can open it is already this user on this
  # machine, with the access to the Docker socket that an agent would be
  # protecting.
  socket: ""

api:
  # Loopback by default. This service holds root-equivalent access to every
  # engine it manages; binding it to the world on first run is not a default
  # any platform should ship.
  host: 127.0.0.1
  port: 8000
  # A development arrangement, and only that. The Controller serves the
  # dashboard itself on the port above (`api/web.py`), so a deployed
  # installation has one origin and needs nothing here -- set it to `[]`. This
  # entry exists for `npm run dev`, where the UI is on 5173 and the API is not.
  cors_origins:
    - http://localhost:5173

log_level: INFO
