# ByStack, as it is configured inside the official image.
#
# Only the settings a container changes are here. Everything else is the
# default and is documented in `backend/bystack.example.yaml`, which is the
# file to read to understand any of this.
#
# Baked into the image at /etc/bystack/bystack.yaml, and mounted over that path
# from the checkout by `compose.yaml`. So on a compose install this file *is*
# the running configuration: edit it here and `docker compose up -d`.

api:
  # 0.0.0.0 *inside the container*, which is not the same decision as
  # `api.host: 0.0.0.0` on a host. A container's network namespace has nothing
  # else in it, so binding narrower than this would only mean the published
  # port reaches nothing. Where the control surface is actually exposed is
  # decided by the publish flag, and `compose.yaml` publishes it to loopback
  # for the reason ADR-0014 gives.
  host: 0.0.0.0
  port: 8000

  # Empty, because the dashboard is served by this process on this port
  # (`api/web.py`). The default names a vite dev server, which is a
  # development arrangement and has no business being allowed by an image.
  cors_origins: []

agents:
  # Off until there is a second machine. An image that opened the fleet
  # listener because it happened to be a container would be deciding something
  # the operator has not been asked yet.
  #
  # To manage other servers, change this to `true` and add this Controller's
  # address to `server_names` below -- both, and then `docker compose up -d`.
  # They are one decision: the listener issues itself a certificate for the
  # names in that list, and an agent that dialled anything not in it fails the
  # handshake and says so.
  enabled: false

  # What your agents will have typed after `wss://`. The default covers a
  # Controller reached at localhost and nothing else, so add the address or
  # hostname other machines use to reach this one -- e.g.
  #
  #     server_names: ["localhost", "127.0.0.1", "::1", "10.0.0.5"]
  server_names: ["localhost", "127.0.0.1", "::1"]

  # An absolute path, and a volume in the image. The default is under a home
  # directory, which in a container is a directory that lives exactly as long
  # as the container does -- and this is where the CA private key, the
  # enrolment registry and `operations.jsonl` go.
  state_dir: /var/lib/bystack

local_agent:
  # Requires the engine's socket to be mounted, and requires this process to
  # be able to read it. See `compose.yaml`: it is a bind mount
  # plus a supplementary group, and there is no way around either -- reading a
  # Docker socket is root-equivalent and the image will not pretend otherwise
  # by running as root to make it easier.
  docker_socket: /var/run/docker.sock

log_level: INFO
