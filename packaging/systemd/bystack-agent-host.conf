# Watching processes on this machine, as an opt-in.
#
#     mkdir -p /etc/systemd/system/bystack-agent.service.d
#     install -m 0644 bystack-agent-host.conf \
#         /etc/systemd/system/bystack-agent.service.d/host.conf
#     systemctl daemon-reload && systemctl restart bystack-agent
#
# **Units need none of this.** Reading and — with the polkit rule beside this
# file — operating systemd services works on a stock install, because both go
# over D-Bus and neither needs to see another user's memory. This file is for
# the *other* half: watching processes that are not units at all.
#
# It exists as a drop-in rather than as lines in `bystack-agent.service`
# because of the question ARCHITECTURE section 11 asks of every feature — *can
# it be optional?* Here it can, and the two things below are the price of the
# feature, so a fleet that only watches services should not be paying it.
# Each is one line in the base unit today, and each is there because the agent
# demonstrably did not need it. Now, for this one capability, it does.

[Service]
# The base unit sets `ProtectProc=invisible`, which hides every process this
# account does not own — which is nearly all of them. A process watch on a
# machine with that in place matches nothing, forever, and looks exactly like
# a daemon that is never running.
#
# `default` restores the kernel's ordinary behaviour: /proc entries are
# readable, and their command lines with them. That is a *read* of what is
# running as root, not a way to affect it. Treat it as such — a command line
# can carry a secret somebody passed as an argument, and this makes those
# legible to whoever can reach the Controller (which, under ADR-0014, is
# anyone who can reach the port).
ProtectProc=default

# And the ability to signal a process this account does not own.
#
# Without it, `stop` and `kill` work only on processes running as
# bystack-agent, which is a watch that can observe a daemon and not touch it.
# With it, this account can signal any process on the machine.
#
# Narrower than it sounds and wider than it looks: `CommandKind` is six
# reversible verbs and the agent refuses anything else (`session.rs`), the
# signal set is an allow-list that stops at SIGTERM/SIGKILL/SIGSTOP/SIGCONT
# (`procfs.rs`), and a signal only ever goes to pids matching a rule an
# operator wrote. But CAP_KILL is not scoped by the kernel to any of that, and
# an agent that is compromised has it. If that is not a trade you want on a
# given machine, leave this file out and watch services instead: a unit's
# lifecycle goes through systemd, which is the supervisor's job anyway.
AmbientCapabilities=CAP_KILL
CapabilityBoundingSet=CAP_KILL
