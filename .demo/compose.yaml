# Temporary demo stack for viewing topology — safe to delete.
services:
  web:
    image: nginx:alpine
    ports:
      - "18080:80"
    depends_on:
      - api
      - cache
  api:
    image: traefik/whoami
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
  cache:
    image: redis:7-alpine
volumes:
  pgdata:
