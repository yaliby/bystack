# The agent is the workspace root, and the other two members are here rather
# than beside it (ADR-0018). One lockfile, so the agent and the manager verify
# a release with the identical `ring`; one `cargo test`, so neither can be
# refactored past the other; and `agent/target/` stays the target directory,
# which is what `scripts/build-agent.sh`, the Dockerfile and CI's cache all
# already name.
#
# Two things about this shape are easy to get wrong and are both load-bearing:
#
#   * A workspace whose root is also a package defaults to **the root package
#     alone**. `cargo test` here runs the agent's tests, reports green, and
#     never compiles the other two -- so CI passes `--workspace` to test and
#     clippy, deliberately and with a comment saying why.
#   * `cargo build --release` *does* build all three. The agent's release path
#     does not want the manager in it, so every consumer of a single artifact
#     passes `-p`.
[workspace]
members = ["release", "manager"]
resolver = "2"

[package]
name = "bystack-agent"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "ByStack agent: observes one Docker engine and reports to the Controller"

[dependencies]
# Current-thread runtime only. The whole workload is one connection, one
# socket stream and a timer; a work-stealing multi-thread scheduler would add
# a thread per core and the synchronisation to go with it, to run a program
# that is blocked in epoll almost all of the time.
tokio = { version = "1", default-features = false, features = [
    "rt", "macros", "net", "io-util", "time", "sync", "signal",
] }

# HTTP to the Docker socket. Hand-rolling this would save perhaps 700 KB, and
# would put a hand-rolled chunked-transfer decoder on the path that carries
# every event -- the one part of the agent whose correctness the entire
# real-time story depends on. Not the place to save space.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"

# Docker's JSON. Only the fields we actually read are declared, so a daemon
# adding fields costs nothing.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

prost = { version = "0.13", default-features = false, features = ["std", "derive"] }

tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect", "handshake",
    # rustls with *no* root store. The two public spellings of this
    # (`rustls-tls-webpki-roots`, `rustls-tls-native-roots`) each bring a set
    # of public CAs we would never consult: the agent trusts exactly one CA,
    # the Controller's, and a public CA that mis-issues for the Controller's
    # hostname must not be a way in. This is the underscore-prefixed feature
    # both of those enable, taken directly and pinned to 0.24 for that reason.
    "__rustls-tls",
] }
# `sink` for the WebSocket write half; `alloc` for `join_all`, which is what
# overlaps the crash-loop inspects in `informer.rs`. Both were already coming
# in via tokio-tungstenite's own feature set -- named here so the build does
# not silently depend on that unification surviving a dependency bump.
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }

# Mutual TLS (ADR-0011). Manual roots rather than the platform trust store:
# the agent pins *our* CA and nothing else, so a public CA that mis-issues for
# the Controller's hostname is not a way in.
#
# `ring` rather than the default `aws-lc-rs` throughout, for the reason the
# checked-in descriptor set exists: the agent is cross-compiled for every
# architecture in a fleet, and aws-lc-rs wants cmake and a C toolchain in each
# of those. `ring` builds where Rust builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = "1"

# CSR generation. The private key never leaves the host and the Controller
# never sees it -- a CA that generated keys for its clients would be a CA that
# can impersonate every one of them.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

# Already in the tree via rustls; used directly for the one SHA-256 that
# checks the CA fingerprint out of a join token.
ring = "0.17"

# The signed-release contract: the manifest parser, the compiled-in key set,
# the ed25519 check and the version ordering (ADR-0017), shared verbatim with
# `bystack-manager` (ADR-0018). It brings no dependency that is not already on
# this line above it.
bystack-release = { path = "release" }

[build-dependencies]
# Reads the checked-in descriptor set rather than shelling out to protoc, so
# building the agent needs nothing but a Rust toolchain. That matters most for
# cross-compilation: otherwise protoc would have to exist in every one of the
# target toolchains.
prost-build = { version = "0.13", default-features = false }

[profile.release]
# The agent runs on hardware the user bought for something else, multiplied by
# the fleet. Every one of these is worth its compile time.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
