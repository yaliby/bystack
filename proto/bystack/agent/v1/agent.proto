// The contract between the Controller and the Agent.
//
// This file is the interface. The transport underneath it (WebSocket today)
// is an implementation detail either side may change without the other
// noticing -- see ADR-0009, which also records the conditions under which we
// would move to gRPC. The `.proto` would not change if we did.
//
// Two rules govern edits here:
//
//   1. **Explicit typed fields, never an opaque blob.** Adding a field to
//      `mapper.py` requires adding it here, so the failure where the Agent
//      trims away a field the Controller quietly needed cannot happen. It
//      costs a three-file change per field and converts a silent runtime
//      failure -- an attribute that is simply always null in the UI -- into
//      one that surfaces at the seam.
//
//   2. **Never renumber, never reuse.** ADR-0008 makes mixed-version fleets a
//      normal operating state, not a migration window: a Controller will be
//      talking to last quarter's agents indefinitely. Retire a field with
//      `reserved`, never by recycling its tag.

syntax = "proto3";

package bystack.agent.v1;

option go_package = "github.com/bystack/bystack/agent/internal/wire/v1;wirev1";

// ---------------------------------------------------------------------------
// Framing
// ---------------------------------------------------------------------------

// Every frame on the wire, in both directions.
//
// One envelope type rather than a message per endpoint, because the transport
// is a single bidirectional stream and the receiver needs one decode before it
// can dispatch.
message Envelope {
  // Monotonic per connection and per direction. Its job is diagnostics, not
  // delivery: WebSocket over TCP does not reorder or drop within a
  // connection, and a gap means the peer has a bug worth finding rather than
  // a retransmission worth requesting.
  uint64 seq = 1;

  oneof payload {
    Hello hello = 10;
    HelloAck hello_ack = 11;
    Sync sync = 12;
    Delta delta = 13;

    Command command = 20;
    CommandResult command_result = 21;
    ResyncRequest resync_request = 22;
    LogsRequest logs_request = 23;
    LogsResponse logs_response = 24;
    LogsSubscribe logs_subscribe = 25;
    LogsChunk logs_chunk = 26;
    LogsCancel logs_cancel = 27;

    EnrollRequest enroll_request = 30;
    EnrollResponse enroll_response = 31;
    RenewalOffer renewal_offer = 32;
    CertificateRequest certificate_request = 33;
    CertificateIssued certificate_issued = 34;

    WatchList watch_list = 40;
    InventoryRequest inventory_request = 41;
    InventoryResponse inventory_response = 42;

    UpgradeOffer upgrade_offer = 50;
    UpgradeChunk upgrade_chunk = 51;
    UpgradeStatus upgrade_status = 52;
  }
}

// Which part of the host a frame describes.
//
// Maps directly onto the store's `reconcile(kinds=...)` parameter, so a
// container frame can claim the whole container slice without saying anything
// about networks. Same scoping rule the informer already used, now on the
// wire.
enum Slice {
  SLICE_UNSPECIFIED = 0;
  SLICE_CONTAINER = 1;
  SLICE_NETWORK = 2;
  SLICE_VOLUME = 3;
  SLICE_IMAGE = 4;

  // The two host slices, and they are not like the four above them.
  //
  // Docker's slices are *discovered*: the agent Lists what the engine has and
  // the membership is whatever it found. A machine has thousands of units and
  // hundreds of processes, and enumerating them on a timer is the second-rate
  // cAdvisor ARCHITECTURE section 12 exists to refuse. So the membership of
  // these two is the operator's `WatchList` and nothing else -- the agent
  // observes what it was told to observe, and a host nobody has selected
  // anything on produces two empty slices at no cost.
  SLICE_UNIT = 5;
  SLICE_PROCESS = 6;
}

// ---------------------------------------------------------------------------
// Connection lifecycle
// ---------------------------------------------------------------------------

// First frame the Agent sends on every connection.
message Hello {
  string agent_version = 1;

  // `GET /info` -> `.ID`. Also the agent's identity, bound into its client
  // certificate at enrollment -- "which host is this" and "which agent is
  // this" are the same question with the same answer (ADR-0011).
  string engine_id = 2;

  EngineInfo engine = 3;

  // The Agent's own read-only setting, advertised rather than inferred. The
  // Agent refuses mutations regardless of what arrives on the wire; telling
  // the Controller lets the UI disable the actions instead of offering them
  // and failing (ARCHITECTURE section 9).
  bool read_only = 4;

  // What this agent build can do. Present so a Controller can talk to an
  // older agent without a version table: absence of a capability is the
  // answer, and it is the same answer for "too old" and "compiled out".
  repeated string capabilities = 5;

  // The agent's own clock, seconds since the epoch.
  //
  // Certificate validation is time-sensitive, so a host with a badly wrong
  // clock cannot connect -- and the way it fails is a generic TLS handshake
  // error that says nothing useful (ADR-0011, Consequences). This field lets
  // the Controller name the real problem on the connection *before* the
  // certificate ages out from under it, which is worth hours to whoever is
  // holding the pager.
  int64 unix_time = 6;
}

// The Controller's answer. Sent before any command is dispatched.
message HelloAck {
  // Changes when the Controller loses its in-memory state. An agent that sees
  // a new epoch knows its partition was dropped and re-sends a full Sync
  // without waiting to be asked.
  string controller_epoch = 1;

  // Seconds between agent-side resyncs. Controller-set so the fleet can be
  // retuned without redeploying agents.
  uint32 resync_interval = 2;

  bool accepted = 3;

  // Populated only when `accepted` is false. The agent logs it and stops
  // retrying in a hot loop -- "certificate revoked" is not a condition that
  // improves by reconnecting.
  string reason = 4;

  repeated string feature_flags = 5;

  // Set with `accepted = false` when the refusal may resolve on its own.
  //
  // The two cases are not the same shape and an agent that treats them alike
  // gets one of them badly wrong. "Awaiting approval" is answered by an
  // operator clicking approve, with the agent doing nothing but coming back;
  // "certificate revoked" is answered by a person on the host, and an agent
  // that retries it forever is a log line every minute until someone notices.
  bool retry = 6;
}

// ---------------------------------------------------------------------------
// Trust (ADR-0011)
// ---------------------------------------------------------------------------
//
// Enrollment runs over the same WebSocket and the same framing as everything
// else, on a separate path (`/agents/enroll`) that does not require a client
// certificate -- because the whole point of enrolling is that the agent does
// not have one yet.
//
// It could have been an HTTP POST. It is not, because the agent would then
// need a TLS-capable HTTP client for exactly one request, in a binary whose
// budget is measured (ARCHITECTURE section 11). One protocol, one contract,
// one client.
//
// The connection is still authenticated in *both* directions before the token
// crosses it: the join token carries the Controller CA's fingerprint, and the
// agent refuses to speak to a server whose chain does not end in it. That is
// k3s's design and it is why enrollment is not trust-on-first-use.

// Agent -> Controller, first and only frame on `/agents/enroll`.
message EnrollRequest {
  // Single-use, short-lived, and worth nothing once redeemed or expired. It
  // grants exactly one capability -- "obtain one certificate" -- for a few
  // minutes. Compare a long-lived shared secret on every host, which is worth
  // the whole fleet forever.
  string join_token = 1;

  // `GET /info` -> `.ID`. Becomes the certificate subject, so this is the
  // moment "which host is this" and "which agent is this" become the same
  // question (ADR-0002, ADR-0011).
  string engine_id = 2;

  // PKCS#10, PEM. The private key never leaves the host and the Controller
  // never sees it -- a CA that generated keys for its clients would be a CA
  // that can impersonate every one of them.
  string csr_pem = 3;

  string agent_version = 4;
}

message EnrollResponse {
  bool accepted = 1;
  string reason = 2;

  string certificate_pem = 3;

  // The CA the agent pins from here on. Sent so the agent's steady-state
  // connections verify against the certificate rather than the fingerprint it
  // was handed in a token.
  string ca_pem = 4;

  int64 not_after = 5;

  // True when the certificate was issued but the agent is not yet approved.
  //
  // Enrollment succeeding and being admitted are deliberately two things: a
  // valid token yields a certificate, and the agent still contributes nothing
  // to the graph until an operator approves it. The agent connects anyway and
  // waits, so approval needs no second visit to the host.
  bool pending_approval = 6;
}

// Controller -> Agent, over the already-authenticated stream at 2/3 of the
// certificate's life. No cron job, no second channel, no expiry outage.
message RenewalOffer {
  // When the current certificate stops working, so the agent can log
  // something an operator can act on if renewal keeps failing.
  int64 not_after = 1;
}

// Agent -> Controller, in reply to a RenewalOffer. Carries no token: the
// connection it arrives on is already mutually authenticated, which is the
// entire reason renewal happens here rather than over a second channel.
message CertificateRequest {
  string csr_pem = 1;
}

message CertificateIssued {
  bool ok = 1;
  string reason = 2;
  string certificate_pem = 3;
  string ca_pem = 4;
  int64 not_after = 5;
}

// ---------------------------------------------------------------------------
// Observations
// ---------------------------------------------------------------------------

// Complete contents of a slice, payloads included.
//
// Sent for every slice at the start of every connection and after a resync
// request. Controller: `reconcile(kinds=slice)`.
message Sync {
  Slice slice = 1;
  repeated Entity entities = 2;
}

// Complete *membership* of a slice; payloads only where the content hash
// moved.
//
// This is the frame that makes the design work. A delta carrying only changed
// entities cannot be reconciled -- "absent" would mean "unchanged", and one
// reconcile would delete every stable container on the host. So `ids` always
// carries every entity currently in the slice, and `changed` carries payloads
// for the subset whose hash moved.
//
// Ids are ~64 bytes and payloads ~1.8 KB, so the Controller can run a full
// authoritative reconcile on every frame at delta cost. Deletions need no
// separate signal: an id that stops appearing is gone.
message Delta {
  Slice slice = 1;
  repeated string ids = 2;
  repeated Entity changed = 3;
}

message Entity {
  string id = 1;
  oneof body {
    Container container = 2;
    Network network = 3;
    Volume volume = 4;
    Image image = 5;
    Unit unit = 6;
    Process process = 7;
  }
}

// -> mapper.map_host
message EngineInfo {
  string id = 1;
  string name = 2;
  string server_version = 3;
  string operating_system = 4;
  string kernel_version = 5;
  string architecture = 6;
  int32 ncpu = 7;
  int64 mem_total = 8;
  int32 containers_running = 9;
  int32 containers_total = 10;
}

// -> mapper.map_container
message Container {
  string id = 1;
  repeated string names = 2;
  string image = 3;
  string image_id = 4;
  string command = 5;
  int64 created = 6;

  // The closed state vocabulary -- `running`, `paused`, `exited`. Hashed.
  string state = 7;

  // Docker's rendered status line: "Up 3 hours", "Exited (137) 3 seconds ago".
  //
  // **Excluded from the agent's content hash.** It changes on a wall clock
  // rather than on a state change, so hashing it would make every container
  // look different on every List and put the full payload set on the network
  // every resync, per host, forever. The failure mode is not an error: it is
  // a system that works perfectly and costs 100x more than it should.
  //
  // Carried as a field anyway, because the Controller extracts the exit code
  // from it -- and that is only meaningful at the moment `state` changes,
  // which *is* hashed. A container that exits is re-sent and brings the
  // string with it.
  string status_text = 8;

  map<string, string> labels = 9;
  repeated Port ports = 10;
  repeated NetworkAttachment networks = 11;
  repeated Mount mounts = 12;

  // The healthcheck's verdict: `healthy`, `unhealthy`, `starting`, or empty
  // where the image declares no healthcheck. **Hashed**, unlike the status
  // line it can be read out of.
  //
  // Hashing it is the whole point. `state` stays `running` when a container
  // starts failing its probe, so without this field in the hash the agent
  // would never resend it and the Controller would never learn -- a card
  // reading `running`, in green, for a container the engine has already
  // given up on. That is the one failure this graph must not have, because
  // an operator reads the absence of a warning as the absence of a problem.
  //
  // Unlike `status_text` this costs nothing to hash: it changes when the
  // healthcheck's verdict changes and at no other time.
  string health = 13;

  // How many times the engine has restarted this container. **Hashed.**
  //
  // The depth of a crash loop, and the number an operator is actually looking
  // for: `Restarting (137)` says the container is failing, and this says
  // whether it has been failing for four seconds or four days. Neither the
  // state nor the exit code can distinguish those.
  //
  // **Not in `GET /containers/json`**, at any API version. It exists only on
  // `GET /containers/{id}/json`, so carrying it costs an inspect. The agent
  // therefore inspects **only containers whose listed state is `restarting`**
  // -- a set that is bounded, usually empty, and exactly the set for which
  // the number means anything. A steady host pays nothing.
  //
  // Hashing it is a decision rather than an oversight. It advances while a
  // container loops, so the container is re-sent on each restart -- but that
  // is an event, not a clock, which is the whole distinction `status_text`
  // fails. A crash loop that deepened is news; "Up 3 hours" becoming "Up 3
  // hours" is not. The cost is bounded by the same restarting set, and a host
  // with a container looping fast enough for this to matter has a problem
  // worth a frame.
  //
  // Zero for a container that has never restarted, which is also proto3's
  // default -- so an older agent that does not send it reads as "never
  // restarted" rather than as an error. That is the correct degradation:
  // absent depth is not a claim of depth.
  uint32 restart_count = 14;
}

message Port {
  uint32 private_port = 1;
  // Zero means unpublished. A port reachable only from inside the engine is
  // not a relationship that crosses out of it, and the mapper drops it.
  uint32 public_port = 2;
  string protocol = 3;
  string host_ip = 4;
}

message NetworkAttachment {
  string network_id = 1;
  string name = 2;
  string ipv4 = 3;
  repeated string aliases = 4;
}

message Mount {
  // `volume` or `bind`. Bind mounts are real dependencies but not entities the
  // engine owns, so the Controller keeps them as container attributes rather
  // than inventing a node for them.
  string type = 1;
  string name = 2;
  string destination = 3;
  string mode = 4;
  bool rw = 5;
}

// -> mapper.map_network
message Network {
  string id = 1;
  string name = 2;
  string driver = 3;
  string scope = 4;
  bool internal = 5;
  bool attachable = 6;
  bool ingress = 7;
  repeated string subnets = 8;
  map<string, string> labels = 9;
}

// -> mapper.map_volume
message Volume {
  string name = 1;
  string driver = 2;
  string mountpoint = 3;
  string scope = 4;
  string created_at = 5;
  map<string, string> labels = 6;
}

// -> mapper.map_image
message Image {
  string id = 1;
  repeated string repo_tags = 2;
  repeated string repo_digests = 3;
  int64 size = 4;
  int64 created = 5;
  map<string, string> labels = 6;
}

// ---------------------------------------------------------------------------
// The host slices: units and processes
// ---------------------------------------------------------------------------
//
// Everything in this section answers one question the four Docker slices never
// had to: *which* of the thousands of things on this machine are we talking
// about. Docker's answer is "all of them", because an engine's whole inventory
// is the topology. A machine's is not — an operator cares about `nginx.service`
// and the two daemons they wrote themselves, and the other 400 units are noise
// that would bury the infrastructure they came to look at, at a CPU cost paid
// on every managed host forever.
//
// So the operator selects, and the selection lives on the Controller as
// configuration (ADR-0001's first durable category: user intent, not
// discoverable). Three frames carry it:
//
//   InventoryRequest / InventoryResponse   what could I watch?      (a read)
//   WatchList                              watch exactly these.     (intent)
//   Sync / Delta over SLICE_UNIT|PROCESS   here is what they are.   (observation)
//
// The agent holds no policy in any of it. It is told a list of names and
// patterns by the side that decides, exactly as it is told a container id when
// a command arrives, and it does not know that a `WatchList` entry becomes a
// node in a graph.

// Controller -> Agent: observe exactly these, and nothing else.
//
// Authoritative and complete, like a `Sync` in the other direction: the list
// replaces whatever the agent was watching, and an entry that stops appearing
// stops being observed. Sent after `HelloAck` on every connection and again
// whenever an operator changes it. An empty list is a legitimate and common
// state — it is what every host starts as — and it means "watch nothing",
// never "keep what you had".
//
// Gated on the `units` / `processes` capabilities. An older agent silently
// ignoring this frame would report neither slice, which reads in the UI as a
// host where every selected service has vanished.
message WatchList {
  repeated WatchEntry entries = 1;
}

message WatchEntry {
  // The Controller's own id for this entry, opaque here. It is what the agent
  // puts in `Entity.id` for a process, because a process watch has no natural
  // name to be known by: `pid` is not an identity (it is recycled, and it
  // changes on every restart of the very thing being watched) and the pattern
  // is editable. The Controller assigns an id once, and the node keeps its
  // identity and its history across both.
  //
  // For a unit this is carried but not needed: `name` is systemd's own id and
  // is already stable, so the unit slice keys on that.
  string id = 1;

  // `unit` | `process`. A string rather than an enum for the reason
  // `Command.verb` is one: an agent that does not know a kind must refuse it
  // cleanly, and proto3 would decode an unknown enum value as UNSPECIFIED and
  // let it be mistaken for something else.
  string kind = 2;

  // For `unit`: systemd's own unit name, `nginx.service`. Carried verbatim,
  // including the `\x2d` escapes systemd uses in mount and path units.
  //
  // **It need not exist.** An operator adding a unit before installing it, or
  // mistyping one, is answered by a node whose `load_state` is `not-found`
  // rather than by silence — a watch that quietly observes nothing looks
  // exactly like a watch that is working.
  string name = 3;

  // For `process`: how `pattern` is matched.
  //
  //   `name`     the executable's own name, /proc/<pid>/comm
  //   `exec`     the absolute path of the executable, /proc/<pid>/exe
  //   `cmdline`  a substring of the full command line
  //
  // Substrings and exact matches only — deliberately not a regular
  // expression. A pattern authored on the Controller is evaluated inside a
  // process on someone else's machine, against every entry in /proc, and a
  // regex engine there is a way to spend a remote host's CPU by typing into a
  // text box (ADR-0016).
  string match_kind = 4;
  string pattern = 5;

  // What the operator calls this, if they said anything.
  //
  // Carried for `process` and meaningless for `unit`, which is why it is on
  // the entry rather than on both payloads: a unit already has a name, and it
  // is systemd's, and relabelling it on a map would mean the thing an operator
  // reads and the thing they would type into `systemctl` are different
  // strings. A process rule has no natural name at all -- `comm` is truncated
  // to 15 characters and a pid is not a name -- so this is the only chance to
  // have one.
  //
  // The agent does not interpret it, exactly as it does not interpret
  // `pattern`: it echoes it back in `Process.label` so that a `Sync` carries
  // everything needed to build the node, rather than making the Controller
  // join two structures to draw a card.
  string label = 6;
}

// -> mapper.map_unit
//
// systemd's vocabulary, shipped up unread. The three-state split is systemd's
// own and is kept rather than flattened: `load_state` says whether the unit
// file exists, `active_state` is the generic lifecycle every unit type shares,
// and `sub_state` is the type-specific detail underneath it. An operator
// diagnosing a service needs all three -- `active` / `exited` is a oneshot
// that finished, `active` / `running` is a daemon, and collapsing them into
// one "status" loses which one they are looking at.
message Unit {
  // `nginx.service`. systemd's own id, and the entity id in this slice.
  string name = 1;
  string description = 2;

  // `loaded` | `not-found` | `masked` | `error`. **Hashed**, and the field
  // that carries the answer for a watch on something that is not installed.
  string load_state = 3;

  // `active` | `inactive` | `failed` | `activating` | `deactivating`.
  // **Hashed** -- this is the state the card is drawn from.
  string active_state = 4;

  // `running` | `dead` | `exited` | `start-pre` | ... **Hashed.**
  string sub_state = 5;

  // `enabled` | `disabled` | `static` | `masked` | empty. **Hashed**, because
  // "running right now but not enabled at boot" is the difference between a
  // service that survives a reboot and one that does not, and an operator
  // reading a green card will assume the first.
  string unit_file_state = 6;

  uint32 main_pid = 7;

  // `ActiveEnterTimestamp`, microseconds since the epoch -- systemd's own
  // unit, converted by the Controller rather than here.
  //
  // **Hashed**, which looks like the `Container.status_text` trap and is its
  // opposite. That field is a rendered duration that moves on a wall clock;
  // this is a fixed instant that moves when the unit actually restarts. The
  // browser renders "for 3 hours" from it without either side re-sending
  // anything in between.
  //
  // Leaving it out of the hash has a concrete cost. `n_restarts` counts only
  // the restarts *systemd* performed under a `Restart=` policy -- a
  // `systemctl restart` by a person does not touch it, and `active_state` is
  // `active` before and after. So for a manual restart this is the only field
  // that moves at all, and excluding it means the map goes on claiming the
  // service has been up since before the restart somebody just performed.
  int64 active_enter_timestamp = 8;

  // `NRestarts`. **Hashed**, and the same argument as `Container.restart_count`
  // one layer down: `failed` is the same state on the second restart and the
  // four-hundredth, so a count outside the hash is a crash loop reported once
  // and never again. It advances on an event, not on a clock.
  uint32 n_restarts = 9;

  // `Result`: `success` | `exit-code` | `signal` | `oom-kill` | `timeout` |
  // `core-dump`. **Hashed.** Why the unit stopped, which `active_state =
  // failed` does not say -- and OOM in particular is a diagnosis an operator
  // would otherwise go to the journal for.
  string result = 10;

  // `ExecMainStatus`: the exit code of the last run. **Hashed.** The systemd
  // half of the exit code the container mapper digs out of Docker's status
  // line, and available here as a number rather than as prose.
  uint32 exec_main_status = 11;

  // Where the unit file is. Carried because "which of the four possible
  // directories is this thing actually loaded from" is a real question during
  // an incident, and `systemctl cat` is not available through a browser.
  string fragment_path = 12;
}

// -> mapper.map_process
//
// One entry per *watch rule*, not per process, and that is the whole identity
// argument. A pid is not an identity: it is recycled by the kernel, and it
// changes every time the thing being watched restarts -- which is precisely
// the event an operator is watching for. So the entity is the rule, its
// `instances` are what currently matches, and a rule matching nothing is an
// observation ("it is not running") rather than an absence.
//
// This is the same two-layer identity as `service` over `container` in
// ADR-0002, arrived at from the other direction.
message Process {
  // Echo of `WatchEntry.id`. The entity id in this slice.
  string watch_id = 1;

  // Echoed back so the Controller can render what is being matched beside
  // what matched, without holding the wire frame and the watch list side by
  // side. Cheap, and it makes a `Sync` self-describing.
  string match_kind = 2;
  string pattern = 3;

  // What matches right now, capped by the agent. **Hashed** -- every field on
  // every instance except `cpu`-anything, of which there is none: this is a
  // control plane and per-process resource sampling belongs to the systems
  // that already do it (ARCHITECTURE section 12).
  repeated ProcessInstance instances = 4;

  // How many matched before the cap, so the Controller can say "12 of 40"
  // rather than quietly showing a truncated list as if it were complete.
  uint32 total = 5;

  // Echo of `WatchEntry.label`, uninterpreted. See there for why this exists
  // on a process and not on a unit.
  string label = 6;
}

message ProcessInstance {
  uint32 pid = 1;

  // /proc/<pid>/comm -- the executable's own name, truncated to 15 characters
  // by the kernel, which is why it is not the identity either.
  string comm = 2;

  // The full command line, NUL-separated in /proc and joined with spaces
  // here. Clamped by the agent: a command line can be a megabyte.
  string cmdline = 3;

  // `R` | `S` | `D` | `Z` | `T` -- the single letter from /proc/<pid>/stat.
  // Interpreted by the Controller, which is where `Z` becomes "zombie".
  string state = 4;

  // Unix seconds. Derived by the agent from the kernel's boot time and the
  // process's start ticks, because /proc reports the second of those in clock
  // ticks since boot and nothing above the agent should have to know that.
  int64 started_at = 5;

  uint32 uid = 6;

  // /proc/<pid>/cgroup, verbatim.
  //
  // The correlation seam, and the reason it is shipped raw. This one string
  // says whether a process is inside a container (`.../docker/<id>`) or owned
  // by a unit (`.../nginx.service`), and *deciding that* is interpretation --
  // which lives on the Controller (ADR-0009 section 1). The agent would need
  // to know the URN scheme to do anything else with it, and it must not.
  string cgroup = 7;
}

// -- inventory --------------------------------------------------------------
//
// "What could I watch on this host?" A read, exactly like `LogsRequest`, and
// not a `Command`: it mutates nothing, a read-only Controller answers it
// through a read-only agent, and it is how the operator fills in the list in
// the first place.
//
// One shot and bounded. This is the only frame in the protocol that enumerates
// a whole machine, and it is answered on demand -- when an operator opens the
// picker -- rather than on a timer. That is the entire difference between this
// feature and a monitoring agent: nobody pays for the enumeration until
// somebody asks to see it.

message InventoryRequest {
  string request_id = 1;

  // `unit` | `process`.
  string kind = 2;

  // Case-insensitive substring, applied **at the agent**. Filtering here
  // rather than in the browser is what keeps a 2,000-unit host from putting
  // its entire unit table on somebody's home uplink so that a text box can
  // discard 1,990 of them.
  string filter = 3;

  // Clamped by the agent, which is the side holding the memory budget and
  // must not trust a number we sent it.
  uint32 limit = 4;
}

message InventoryResponse {
  string request_id = 1;

  bool ok = 2;
  string reason = 3;

  repeated InventoryItem items = 4;

  // Matches before the cap. The UI says "200 of 412" rather than presenting a
  // truncated list as the whole truth -- the operator whose service is number
  // 300 would otherwise conclude it is not installed.
  uint32 total = 5;
}

// One row in the picker. Deliberately not a `Unit` or a `Process`: this is a
// menu, and carrying the full observation payload for 400 units to draw a list
// of names would put the cost of watching everything back on a host that has
// chosen to watch three things.
message InventoryItem {
  // What a `WatchEntry` would name: the unit name, or for a process the
  // executable path the rule would be built from.
  string id = 1;

  string name = 2;
  string description = 3;

  // `active` / `inactive` / `failed` for a unit; the state letter for a
  // process. Shown so an operator picking from a list of four hundred can see
  // which ones are actually running.
  string state = 4;

  // `sub_state` for a unit, the command line for a process.
  string detail = 5;

  uint32 pid = 6;
}

// ---------------------------------------------------------------------------
// Commands
// ---------------------------------------------------------------------------

message Command {
  // Correlates the CommandResult. This field and the pending-command map on
  // each side are the price of not using gRPC, which would have generated the
  // correlation for us -- about 60 lines per side, against 8 MB of agent
  // binary. See ADR-0009.
  string command_id = 1;

  // `start` | `stop` | `restart` | `pause` | `unpause` | `kill`. A string, not
  // an enum, so a Controller can dispatch a verb an older agent will reject
  // cleanly rather than one that decodes as UNSPECIFIED and is silently
  // treated as something else.
  string verb = 2;

  // The target in the vocabulary of whatever owns it: Docker's own container
  // id, systemd's own unit name, or a `WatchEntry.id` for a process rule. The
  // Agent does not know the URN scheme and must not learn it, so the
  // Controller unwraps the URN before the frame is built.
  string target_id = 3;

  // Which of those `target_id` is, because the three namespaces overlap in
  // shape and the agent must not guess. Empty means `container`, which is what
  // every Controller before the host slices sent and what every agent that
  // predates them assumes -- so an old frame and a new agent agree without a
  // version check.
  string target_kind = 5;

  map<string, string> args = 4;
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string detail = 3;

  // True when the target was already in the requested state -- Docker's 304.
  // Distinct from `ok` because a restart that changed nothing is not a
  // restart that worked.
  bool unchanged = 4;
}

// Controller -> Agent: re-List and re-hash these slices.
//
// Repairs the *Agent's* hash map, which after ADR-0009 is the only thing that
// can be wrong; the Controller's graph is reconciled by every frame. If the
// hashes agree the resulting Delta is identical to a steady-state one and
// costs the same zero bytes.
message ResyncRequest {
  repeated Slice slices = 1;
}

// -- container logs ---------------------------------------------------------
//
// A read, and deliberately not a `Command`. `CommandKind` is the closed set
// of *mutations* a read-only Controller refuses, and refusing to show an
// operator why a container is failing because the platform is in its safe
// mode would be exactly backwards -- read-only exists so that looking is
// always allowed.
//
// One shot, not a stream. `tail` bounds the answer at the daemon, which is
// what makes this safe to answer from an agent with a small memory budget on
// a container that has been logging for a month. Following a live log is a
// different feature with a different backpressure problem, and pretending
// this is the first half of it would build the wrong shape.

message LogsRequest {
  // Correlates the response, exactly as `command_id` does. Same reason.
  string request_id = 1;

  // Docker's own id. The agent does not know the URN scheme.
  string target_id = 2;

  // Lines from the end. Clamped by the agent: an unbounded request is a way
  // to make a remote host read a gigabyte into memory on our behalf.
  uint32 tail = 3;
}

message LogsResponse {
  string request_id = 1;

  // False when the engine refused or the container is gone. `reason` then
  // carries the engine's own words -- an operator chasing a failure should
  // not have to guess whether the container or the request was wrong.
  bool ok = 2;
  string reason = 3;

  repeated LogLine lines = 4;
}

// Open a live tail. The streaming sibling of `LogsRequest`.
//
// Kept as its own message rather than a `follow` flag on `LogsRequest`,
// because the two have different lifetimes and different failure modes. A
// `LogsRequest` is one question with one answer; a subscription is a thing
// that exists until somebody ends it, and conflating them would make
// `LogsResponse` mean "your answer" or "the first of many" depending on a
// bool nobody can see at the point they handle it.
//
// Still not a `CommandKind`, for the reason `LogsRequest` is not: reads are
// answered by a read-only Controller and a read-only agent. Refusing to show
// an operator a failing container because the platform is in its safe mode is
// exactly backwards.
message LogsSubscribe {
  // Correlates every chunk that follows, and is what `LogsCancel` names.
  string request_id = 1;

  // Docker's own id. The agent does not know the URN scheme.
  string target_id = 2;

  // Backfill before the live tail begins, so opening the panel on a container
  // that failed a minute ago shows why rather than an empty box waiting for a
  // line that will never come. Clamped exactly as `LogsRequest.tail` is.
  uint32 tail = 3;
}

// Lines from a live subscription. Many per `LogsSubscribe`.
message LogsChunk {
  string request_id = 1;

  repeated LogLine lines = 2;

  // Set once, on the last chunk. The container exited, the engine closed the
  // stream, or the agent gave up -- and the operator needs to know the silence
  // is the end rather than a quiet minute.
  bool done = 3;

  // Populated when `done` is set by a failure rather than by the log ending
  // normally. The engine's own words where there are any.
  string reason = 4;
}

// End a subscription. Sent by the Controller when the last reader goes away.
//
// Unsubscribing matters more here than it would for a request/response pair:
// a forgotten subscription is a `docker logs --follow` running forever on
// someone's machine, pushing bytes down an uplink nobody is reading.
message LogsCancel {
  string request_id = 1;
}

message LogLine {
  // Docker multiplexes both streams down one connection and tags each frame.
  // Keeping the tag is most of the diagnostic value: the line that explains
  // a crash is almost always on stderr.
  bool stderr = 1;

  // The line as the container wrote it, prefixed by the RFC 3339 timestamp
  // the daemon records. Requested from the daemon rather than stamped here,
  // because the agent's clock is not when the line was written.
  string text = 2;
}

// ---------------------------------------------------------------------------
// Upgrade (ADR-0017)
// ---------------------------------------------------------------------------
//
// The Controller is a **distribution channel and is not trusted with
// content**. It holds releases, picks the artifact matching each host's
// architecture, and sends. It has no signing key, so a Controller in an
// attacker's hands can withhold an upgrade, send an old one, or send nothing
// -- and cannot produce a binary any agent will run.
//
// What makes a binary worth executing is therefore decided entirely on the
// host: the signature below is checked against a key compiled into the agent,
// and the digest of what arrived is checked against the one inside the signed
// document. Neither answer depends on how the Controller obtained the bytes,
// which is why fetching them from GitHub Releases, shipping them in the wheel
// and an operator dropping files in a directory are equivalent here.
//
// Gated on the `upgrade` capability in `Hello.capabilities`. An agent built
// with no keys does not advertise it and cannot be sent one of these frames --
// which is the same answer as "too old", and is the answer we want: absence,
// with a diagnosis, rather than a transfer that ends in a refusal after a
// megabyte has crossed someone's uplink.

// Controller -> Agent: a release is available for this host.
//
// Nothing is installed by this frame and nothing is installed by the chunks
// that follow it. The agent verifies, stages inside the `StateDirectory` it
// already owns, and writes a trigger file; a `.path` unit starts a `oneshot`
// with no network which is the only thing in the system that may write to
// `/usr/local/bin`. The daemon that holds this connection never touches the
// executable, which is why the agent's own unit is unchanged by this feature.
message UpgradeOffer {
  // Correlates the chunks and the status frames. One transfer at a time per
  // agent; a second offer while one is in flight replaces it, exactly as a
  // second connection displaces the first.
  string transfer_id = 1;

  // **The signed document, verbatim.** Not its fields: the bytes.
  //
  // `{name, version, arch, sha256, released_at}` in a canonical text form the
  // agent parses for itself. Carrying the fields as protobuf and signing them
  // separately would mean the sender chooses the parse -- and protobuf
  // serialization is not canonical, so the signer and the verifier would be
  // hashing different bytes for the same message. What is signed is what is
  // sent and what is read.
  //
  // The version is inside it for the reason the whole document is signed
  // rather than just the digest. A digest alone is a genuinely signed artifact
  // that the *sender* gets to name a version for: an old release with a known
  // weakness, announced as new, against an anti-downgrade check comparing a
  // number the attacker chose. `arch` is the same argument at a smaller scale,
  // and `name` because a key that ever signs a second artifact must not let
  // one be presented as the other.
  bytes manifest = 2;

  // Ed25519 over `manifest`, raw 64 bytes.
  //
  // Verified against a **set** of keys compiled into the agent at build time,
  // not against a file on the host: a key in the daemon's `StateDirectory` is
  // writable by the process it is supposed to constrain, and anywhere else it
  // is a file that arrived over the same channel as the binary it verifies. A
  // set rather than one key is the entire rotation mechanism -- version N
  // trusts {old, new} and version N+1 trusts {new}, so two ordinary upgrades
  // retire a key and a leak is answered by a release.
  bytes signature = 3;

  // What the chunks will add up to. Cross-checked against the bytes actually
  // received before the digest is computed, so a truncated transfer is named
  // as one rather than reported as a signature failure.
  uint64 total_bytes = 4;
}

// Controller -> Agent: part of the artifact named by an offer.
//
// **Chunked, and not for memory.** `dist/` is 2.2 MB for x86_64 against a
// `MemoryMax=64M`, so a single frame would fit. It is chunked because this
// socket also carries the live graph, and a multi-megabyte burst on it is a
// topology map that stops moving for the duration of every upgrade. The
// offsets also make a dropped connection resumable rather than a transfer
// that starts again.
message UpgradeChunk {
  string transfer_id = 1;

  // Where these bytes belong in the artifact. Carried rather than implied by
  // arrival order, because the agent resumes from a partial file after a
  // reconnect and must refuse anything that does not continue it -- an
  // out-of-order chunk is a bug or an attempt to splice, and both are answered
  // by refusing the transfer rather than by seeking.
  uint64 offset = 2;

  bytes data = 3;

  // Set on the last chunk. The agent verifies and stages when it arrives.
  bool last = 4;
}

// Agent -> Controller: what happened to a transfer.
//
// Sent at least twice for a healthy upgrade -- once accepting the offer, once
// when the artifact is staged -- and once with a reason for every refusal.
// The refusals are the point: an agent that simply stopped answering would be
// indistinguishable from a host that went away, and the operator would be left
// with a rollout that stalled and no sentence explaining it.
message UpgradeStatus {
  string transfer_id = 1;

  // `accepted` | `staged` | `refused` | `failed`.
  //
  // A string rather than an enum, for the reason `Command.verb` is one: proto3
  // decodes an unknown enum value as UNSPECIFIED, and a state a Controller
  // does not recognise must stay unrecognised rather than become the zero
  // value of something else.
  //
  //   accepted  the manifest verified and the version is higher; send bytes
  //   staged    written and verified on disk; the trigger file is written and
  //             this agent is about to be restarted by a process it does not
  //             control, so the next thing the Controller sees is a
  //             disconnect and a `Hello` carrying the new version
  //   refused   this agent will not install it: a bad signature, a version
  //             that is not higher, the wrong architecture. Not retryable.
  //   failed    something on this host went wrong: no space, an unwritable
  //             state directory, a truncated transfer. Worth retrying.
  string state = 2;

  // Written to be shown to an operator. Populated for every refusal and
  // failure, and empty otherwise.
  string reason = 3;

  // How much of this artifact the agent already holds, from a partial
  // transfer that survived a reconnect. Sent with `accepted`, and the
  // Controller starts from it: zero means send everything, which is what an
  // agent with nothing staged reports and what proto3's default gives us for
  // an agent too old to have the field.
  uint64 resume_from = 4;
}
